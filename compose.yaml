name: hadoop-nexus

x-hadoop-common: &hadoop-common
  image: ghcr.io/apache/hadoop:3.3.6
  platform: linux/amd64
  restart: on-failure
  environment:
    HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
  volumes:
    - ./docker/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    - ./docker/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    - ./docker/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
    - ./docker/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
  networks:
    - nexus

services:
  namenode:
    <<: *hadoop-common
    hostname: namenode
    command: ["bash", "/opt/nexus/start-namenode.sh"]
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - ./docker/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./docker/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./docker/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./docker/start-namenode.sh:/opt/nexus/start-namenode.sh:ro
      - .:/workspace

  datanode:
    <<: *hadoop-common
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    volumes:
      - ./docker/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./docker/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./docker/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro

  resourcemanager:
    <<: *hadoop-common
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    depends_on:
      - namenode
    ports:
      - "8088:8088"

  nodemanager:
    <<: *hadoop-common
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
      - datanode
    ports:
      - "8042:8042"
    volumes:
      - ./docker/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./docker/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./docker/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro

  historyserver:
    <<: *hadoop-common
    hostname: historyserver
    command: ["mapred", "historyserver"]
    depends_on:
      - resourcemanager
    ports:
      - "19888:19888"

networks:
  nexus:
